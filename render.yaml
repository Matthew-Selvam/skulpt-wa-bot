# render.yaml - Render deployment configuration
services:
  - type: web
    name: trophybot-webhook
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:webhook
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /health
    autoDeploy: true
    branch: main
